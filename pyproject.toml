[project]
name = "to-do-list"
version = "0.1.0"
description = "Django Todo List Application"
authors = [
    {name = "Finimen", email = "finimensniper@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "django==4.2.7",
    "psycopg2-binary>=2.9.11,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2,<9.0.0",
    "pytest-django>=4.11.1,<5.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "factory-boy>=3.3.3,<4.0.0",
    "black>=25.9.0,<26.0.0",
    "faker>=24.0.0,<25.0.0",
]

# УБИРАЕМ Poetry секции или исправляем пути
# [tool.poetry]
# packages = [{include = "project", from = "src"}]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "project.settings"
python_files = ["test_*.py", "*_tests.py"]
pythonpath = "src"
addopts = [
    "--reuse-db",
    "-v",
    "--cov=todos",
    "--cov=accounts",
    "--cov-report=term-missing:skip-covered",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.black]
target-version = ['py39']
line-length = 88
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  | \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''